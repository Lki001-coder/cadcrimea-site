name: Crypto Market Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-market-feed.yml'
      - 'scripts/crypto_market_feed.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-market-feed
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore feed history
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/crypto-feed
          if git ls-remote --exit-code --heads origin crypto-data >/dev/null 2>&1; then
            git fetch origin crypto-data:refs/remotes/origin/crypto-data
            git show origin/crypto-data:history.json > /tmp/crypto-feed/history.json 2>/dev/null || true
          fi

      - name: Fetch and aggregate public futures data
        shell: bash
        run: python3 scripts/crypto_market_feed.py /tmp/crypto-feed

      - name: Publish isolated data branch
        shell: bash
        run: |
          set -e
          git config user.name 'crypto-feed-bot'
          git config user.email 'crypto-feed-bot@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/crypto-data; then
            git checkout -B crypto-data origin/crypto-data
          else
            git checkout --orphan crypto-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/crypto-feed/latest.json ./latest.json
          cp /tmp/crypto-feed/anomalies.json ./anomalies.json
          cp /tmp/crypto-feed/history.json ./history.json
          cp /tmp/crypto-feed/health.json ./health.json
          git add latest.json anomalies.json history.json health.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "update crypto market feed $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin crypto-data --force
