name: Crypto Toobit Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-market-feed.yml'
      - 'scripts/live_toobit_snapshot.py'
      - 'scripts/toobit_feed.py'
  schedule:
    # Two staggered 5-minute schedules. Each individual cron respects GitHub's
    # 5-minute minimum; together they provide a second chance every 2-3 min.
    - cron: '1-56/5 * * * *'
    - cron: '4-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-toobit-snapshot
  cancel-in-progress: true

jobs:
  publish-toobit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build fresh Toobit snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/crypto-feed
          if python3 scripts/live_toobit_snapshot.py /tmp/crypto-feed/toobit.json; then
            echo 'Using always-on server live feed'
          else
            echo 'Live feed unavailable/stale; falling back to direct Toobit API'
            rm -f /tmp/crypto-feed/toobit.json
            python3 scripts/toobit_feed.py /tmp/crypto-feed
          fi
          python3 - <<'PY'
          import json, time
          p='/tmp/crypto-feed/toobit.json'
          d=json.load(open(p,encoding='utf-8'))
          age=int(time.time()*1000)-int(d['generated_ms'])
          assert age < 120000, f'generated snapshot already stale: {age}ms'
          assert len(d.get('market',{})) >= 8, 'too few symbols in snapshot'
          print({'generated_age_ms':age,'symbols':len(d['market']),'source':d.get('source','direct-toobit')})
          PY

      - name: Publish to crypto-data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'crypto-feed-bot'
          git config user.email 'crypto-feed-bot@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin crypto-data:refs/remotes/origin/crypto-data || true
            if git show-ref --verify --quiet refs/remotes/origin/crypto-data; then
              git checkout -B crypto-data origin/crypto-data
            else
              git checkout --orphan crypto-data
              git rm -rf . >/dev/null 2>&1 || true
            fi

            cp /tmp/crypto-feed/toobit.json ./toobit.json
            git add toobit.json
            if git diff --cached --quiet; then
              echo 'No snapshot change'
              exit 0
            fi
            git commit -m "update Toobit snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            if git push origin HEAD:crypto-data; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying with latest crypto-data"
            git checkout main
            sleep 2
          done
          echo 'Failed to publish Toobit snapshot after 3 attempts' >&2
          exit 1
